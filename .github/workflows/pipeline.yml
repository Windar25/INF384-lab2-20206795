name: pipeline

on:
  push:
  workflow_dispatch:
  pull_request:

jobs:

  validar:
    name: Validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Ejecutar pruebas
        run: pytest --cov=src --cov-report=xml

      - name: Analisis de calidad
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

  publicar:
    needs: validar
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    name: Publicar artefacto
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          
      - name: Leer versión del archivo
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Construir el paquete
        run: python -m build
      
      - name: Publicar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: despachos-${{ steps.get_version.outputs.VERSION }}
          path: dist/
          overwrite: true
      
      
      
